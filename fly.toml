# fly.toml app configuration file generated for pinjam-in on 2026-11-07T06:47:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pinjam-in'
primary_region = 'sin'

[build]
  dockerfile = 'fly.Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  CACHE_STORE = 'file'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  QUEUE_CONNECTION = 'database'
  SESSION_DRIVER = 'database'
  SESSION_LIFETIME = '120'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
